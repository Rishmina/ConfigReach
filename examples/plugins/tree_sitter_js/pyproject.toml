[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "configreach-tree-sitter-js-example"
version = "0.1.0"
description = "Example optional tree-sitter JavaScript adapter for ConfigReach"
requires-python = ">=3.11"
dependencies = [
  "configreach>=0.7",
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-javascript>=0.23,<0.24",
]

[project.entry-points."configreach.adapters"]
tree-sitter-js = "configreach_tree_sitter_js:TreeSitterJavaScriptAdapter"

[tool.setuptools]
py-modules = ["configreach_tree_sitter_js"]
