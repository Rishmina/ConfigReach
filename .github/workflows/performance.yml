name: Performance
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Run polyglot performance budget
        run: python benchmarks/perf_budget.py --files 800 --min-files-per-second 150 --output perf-budget.json
      - uses: actions/upload-artifact@v4
        with:
          name: configreach-performance-budget
          path: perf-budget.json
