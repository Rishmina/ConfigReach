name: Publish ConfigReach to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pyproject.toml

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/configreach

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install release toolchain
        run: python -m pip install -e '.[dev]'

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import configreach
          expected = f"v{configreach.__version__}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"Release tag {actual!r} does not match package version {expected!r}")
          print(f"Publishing ConfigReach {configreach.__version__}")
          PY

      - name: Verify package and runtime versions match
        run: |
          python - <<'PY'
          import pathlib
          import tomllib
          import configreach
          metadata = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          package_version = metadata["project"]["version"]
          if package_version != configreach.__version__:
              raise SystemExit(
                  f"pyproject version {package_version!r} does not match runtime version {configreach.__version__!r}"
              )
          print(f"Publishing ConfigReach {package_version}")
          PY

      - name: Run test suite
        run: pytest

      - name: Build reproducible release artifacts
        run: python tools/release_repro.py --output release-repro.json --artifacts-dir dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
