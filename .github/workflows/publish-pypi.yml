name: Publish ConfigReach to PyPI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-pypi.yml
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: "${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'release: publish ConfigReach 0.9.0 to PyPI' }}"
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/configreach

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install release toolchain
        run: python -m pip install -e '.[dev]'

      - name: Verify release version
        run: |
          python - <<'PY'
          import configreach
          expected = '0.9.0'
          if configreach.__version__ != expected:
              raise SystemExit(f'Expected {expected}, found {configreach.__version__}')
          print(f'ConfigReach {expected}')
          PY

      - name: Run test suite
        run: pytest

      - name: Build reproducible release artifacts
        run: python tools/release_repro.py --output release-repro.json --artifacts-dir dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.9.0 dist/* release-repro.json \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "ConfigReach v0.9.0" \
            --notes "ConfigReach v0.9.0 release hardens deterministic configuration coverage for publication. This release includes reproducible wheel/sdist verification, release manifests, Adapter API v1 examples, compatibility corpus coverage, performance-history artifacts, and the existing CPU-only, model-free configuration coverage engine."
