name: Create ConfigReach v0.9.1 GitHub Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v0.9.1.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out published source commit
        uses: actions/checkout@v4
        with:
          ref: de01abe1e00c9f2c9d9f1131a3256ed5452e7a81
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install release toolchain
        run: python -m pip install -e '.[dev]'

      - name: Verify v0.9.1 source version
        run: |
          python - <<'PY'
          import pathlib, tomllib, configreach
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert version == '0.9.1', version
          assert configreach.__version__ == '0.9.1', configreach.__version__
          print('ConfigReach', version)
          PY

      - name: Run tests
        run: pytest

      - name: Build reproducible release artifacts
        run: python tools/release_repro.py --output release-repro.json --artifacts-dir dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.9.1 \
            dist/configreach-0.9.1-py3-none-any.whl \
            dist/configreach-0.9.1.tar.gz \
            release-repro.json \
            --repo "${{ github.repository }}" \
            --target de01abe1e00c9f2c9d9f1131a3256ed5452e7a81 \
            --title "ConfigReach v0.9.1" \
            --notes "ConfigReach v0.9.1 is a discoverability-focused patch release. It adds real-world configuration-testing search/problem examples to the README and PyPI metadata, including environment variable test coverage, feature flag test coverage, configuration testing, config coverage, test environment variables, and Kubernetes configuration testing. Core deterministic analysis behavior remains unchanged from v0.9.0. Published to PyPI using Trusted Publishing/OIDC after 59 passing tests and exact reproducible wheel/sdist verification." \
            --latest
