name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src tests
      - run: python -m py_compile examples/plugins/tree_sitter_js/configreach_tree_sitter_js.py
      - run: pytest
      - run: configreach scan examples/basic --format json --no-cache
      - run: configreach scan examples/polyglot --format sarif --output /tmp/configreach.sarif --no-cache
      - run: configreach scan examples/polyglot --format html --output /tmp/configreach.html --no-cache
      - run: configreach scan examples/frameworks --format json --output /tmp/configreach-frameworks.json --no-cache
      - run: configreach plan examples/combinations --format json --output /tmp/configreach-plan.json --no-cache
      - run: configreach plan examples/combinations --fixture pytest --output /tmp/configreach-fixtures.py --no-cache
      - run: configreach workspace . --format json --output /tmp/configreach-workspaces.json --no-cache
      - run: configreach adapters --format json --output /tmp/configreach-adapters.json
      - run: configreach reproduce examples/combinations --runs 3 --format json --output /tmp/configreach-repro.json
      - run: configreach doctor examples/polyglot
