[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "configreach"
version = "0.9.0"
description = "Deterministic configuration coverage for software repositories"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Saurav Singla"}]
keywords = ["configuration", "coverage", "testing", "ci", "devtools", "feature-flags", "environment-variables"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "build>=1.2,<2", "wheel>=0.44,<1", "setuptools>=68"]

[project.scripts]
configreach = "configreach.entrypoint:main"

[project.entry-points."configreach.adapters"]
# Third-party packages register adapters in this group. The core intentionally
# ships without optional external parser dependencies.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
